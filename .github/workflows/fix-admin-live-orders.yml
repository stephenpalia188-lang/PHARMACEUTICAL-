name: Apply Admin Live Orders Reliability Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'stephenpalia188-lang'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add live order fallback polling
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/AdminPortal.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "    void startRealtime();\n\n    return () => {\n      disposed = true;\n      if (channel) void supabase.removeChannel(channel);\n    };"
          replacement = "    void startRealtime();\n\n    // Keep the dashboard live even if a browser/network blocks the Realtime WebSocket.\n    // The API remains the source of truth; this is only a lightweight live-update fallback.\n    const liveOrderPoll = window.setInterval(() => {\n      if (!disposed) void fetchAdminOrders();\n    }, 2500);\n\n    return () => {\n      disposed = true;\n      window.clearInterval(liveOrderPoll);\n      if (channel) void supabase.removeChannel(channel);\n    };"

          if marker not in text:
              raise SystemExit('Expected realtime cleanup block not found; refusing unsafe edit')
          if 'liveOrderPoll' in text:
              raise SystemExit('Live order polling patch already present')

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-admin-live-orders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminPortal.tsx .github/workflows/fix-admin-live-orders.yml
          git diff --cached --check
          git diff --cached -- src/components/AdminPortal.tsx
          git commit -m "fix: keep admin orders live when realtime websocket drops"
          git push origin HEAD:main
